name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, macos-latest]
        include:
          - node: 22
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/cli.mjs
          test "$(find dist -type f | wc -l | tr -d '[:space:]')" -eq 1
          test "$(head -n 1 dist/cli.mjs)" = '#!/usr/bin/env node'
          bytes="$(wc -c < dist/cli.mjs | tr -d '[:space:]')"
          if (( bytes >= 200000 )); then
            echo "dist/cli.mjs is ${bytes} bytes; it must be under 200000"
            exit 1
          fi

      - name: Test packed CLI
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d "$RUNNER_TEMP/amigolint-pack.XXXXXX")"
          unpack_dir="$(mktemp -d "$RUNNER_TEMP/amigolint-unpack.XXXXXX")"
          install_dir="$(mktemp -d "$RUNNER_TEMP/amigolint-install.XXXXXX")"
          pack_path="$pack_dir/amigolint.tgz"

          pnpm pack --out "$pack_path"
          # On Windows, $RUNNER_TEMP is a native path ("D:\a\_temp\...");
          # Git Bash's tar misreads the drive letter as a remote host:path
          # spec ("Cannot connect to D:"). --force-local isn't the fix
          # either: BSD tar (macOS) doesn't have that flag, and Windows'
          # bundled tar still mishandled it. Convert to an unambiguous
          # POSIX-style path with cygpath (present in Git Bash) instead;
          # elsewhere cygpath doesn't exist, so the paths are used as-is.
          if command -v cygpath >/dev/null 2>&1; then
            tar_pack_path="$(cygpath -u "$pack_path")"
            tar_unpack_dir="$(cygpath -u "$unpack_dir")"
          else
            tar_pack_path="$pack_path"
            tar_unpack_dir="$unpack_dir"
          fi
          tar -xzf "$tar_pack_path" -C "$tar_unpack_dir"

          packed_bytes="$(wc -c < "$pack_path" | tr -d '[:space:]')"
          unpacked_bytes="$(node --input-type=module - "$unpack_dir/package" <<'NODE'
          import { readdir, stat } from 'node:fs/promises';
          import path from 'node:path';

          async function directorySize(directory) {
            let total = 0;
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                total += await directorySize(entryPath);
              } else if (entry.isFile()) {
                total += (await stat(entryPath)).size;
              }
            }
            return total;
          }

          process.stdout.write(String(await directorySize(process.argv[2])));
          NODE
          )"

          echo "Packed tarball size: ${packed_bytes} bytes"
          echo "Unpacked package size: ${unpacked_bytes} bytes"
          if (( unpacked_bytes >= 2000000 )); then
            echo "Unpacked package is ${unpacked_bytes} bytes; it must be under 2000000"
            exit 1
          fi

          (
            cd "$install_dir"
            npm init --yes >/dev/null
            npm install "$pack_path"
            test -x node_modules/.bin/amigolint

            medium_dir="$install_dir/medium-repo"
            node --input-type=module - "$medium_dir" <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const root = process.argv[2];
          for (let directoryIndex = 0; directoryIndex < 100; directoryIndex += 1) {
            const directory = path.join(root, 'src', `group-${directoryIndex}`);
            await mkdir(directory, { recursive: true });
            await Promise.all(
              Array.from({ length: 100 }, (_, fileIndex) =>
                writeFile(path.join(directory, `module-${fileIndex}.ts`), ''),
              ),
            );
          }
          await writeFile(
            path.join(root, 'AGENTS.md'),
            '# Validation\n\nRun `npm test`.\n',
          );
          NODE

            started_at="$(node -e 'process.stdout.write(String(Date.now()))')"
            npx --no-install amigolint "$medium_dir" --no-color >/dev/null
            finished_at="$(node -e 'process.stdout.write(String(Date.now()))')"
            elapsed_ms="$((finished_at - started_at))"
            echo "Cold npx lint time: ${elapsed_ms} ms"
            if (( elapsed_ms >= 5000 )); then
              echo "Cold npx lint took ${elapsed_ms} ms; it must be under 5000"
              exit 1
            fi

            package_version="$(node -p "require('./node_modules/amigolint/package.json').version")"
            test "$(npx amigolint --version)" = "$package_version"
            node --input-type=module -e "import('amigolint').then(({ lint }) => { if (typeof lint !== 'function') process.exit(1) })"
          )
